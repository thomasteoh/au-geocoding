name: ci

# Runs on every push and pull request, and is reused by both release
# workflows so a tag never ships an image whose tests did not run.
# Fixture-only (R9.2): CI never downloads real data. Actions pinned by commit
# SHA (R9.5).

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  modules:
    name: build/vet/test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [shared, geocoding, places]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    # Each module is also built standalone (GOWORK=off) so a release image,
    # which builds without the workspace, can never diverge from CI.
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  # INV-1: no raw query text is ever logged or emitted as telemetry. Decoding
  # the body is fine; logging r.Body or RawQuery is a violation.
  inv1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: INV-1 check
        run: |
          if grep -rnE "log\.[A-Za-z]+\(.*r\.Body|log\.[A-Za-z]+\(.*RawQuery|logger\.(Info|Error|Warn)\(.*r\.Body|logger\.(Info|Error|Warn)\(.*RawQuery|fmt\.Print.*r\.Body|fmt\.Print.*RawQuery" \
              --include="*.go" geocoding/cmd geocoding/internal places/cmd places/internal shared; then
            echo "INV-1 violation: raw body/query text logged"; exit 1
          fi
          echo "INV-1 ok"

  # Corpus-subset smoke (R9.3): cmd/gen seeds a synthetic fixture DB and runs
  # the committed corpus subset against it.
  places-smoke:
    runs-on: ubuntu-latest
    needs: modules
    defaults:
      run:
        working-directory: places
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26"
          cache-dependency-path: places/go.sum
      - name: Corpus-subset smoke
        run: go run ./cmd/gen -corpus testdata/corpus.tsv -db "$RUNNER_TEMP/vic.db" -limit 50

  # Contract smoke: augeo over the /resolve contract against the mock resolver
  # (canned candidates; the geocoder never touches real data).
  geocoding-smoke:
    runs-on: ubuntu-latest
    needs: modules
    defaults:
      run:
        working-directory: geocoding
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26"
          cache-dependency-path: geocoding/go.sum
      - name: Contract smoke (mock resolver)
        run: ../scripts/smoke-geocoding.sh

  # Images build from the repository root so shared/ is in the context. No
  # push here; release workflows push.
  docker:
    runs-on: ubuntu-latest
    needs: modules
    strategy:
      fail-fast: false
      matrix:
        service: [geocoding, places]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Build ${{ matrix.service }} image
        run: docker buildx build -f ${{ matrix.service }}/Dockerfile .
