{{define "head"}}<meta name="robots" content="noindex">{{end}}
{{define "content"}}
<section class="login">
  <h1>Signing out</h1>
  {{with .Data}}
  <div class="card">
    <p>Finishing sign-out with your identity provider.</p>
    <form id="saml-autosubmit" method="post" action="{{.Action}}">
      <input type="hidden" name="{{.Param}}" value="{{.Value}}">
      {{if .RelayState}}<input type="hidden" name="RelayState" value="{{.RelayState}}">{{end}}
      <button type="submit">Continue</button>
    </form>
  </div>
  {{end}}
</section>
{{end}}
{{define "scripts"}}<script src="/console/static/autosubmit.js"></script>{{end}}
