# Prometheus scrape config for the au-system compose stack. Both services
# expose /metrics (counters per endpoint/status, latency histogram, no
# query-derived labels). Targets are compose service names.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: auplaces
    metrics_path: /metrics
    static_configs:
      - targets:
          - places:8080

  - job_name: augeo
    metrics_path: /metrics
    static_configs:
      - targets:
          - augeo:8080
