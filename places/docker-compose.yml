# Compose example for the self-host release (Step 4). The server mounts the
# dataset read-only (:ro) per D-019/INV-4 — only the loader writes.
#
# The dataset is built out-of-band by the loader binary (auplaces-load) into a
# named volume, then the server mounts it read-only. The loader runs as a
# one-shot container (or an init container); the server never writes.
#
# Usage:
#   1. Build the dataset into the volume (one-shot):
#        docker compose run --rm loader
#   2. Start the serving container:
#        docker compose up -d server
#   3. Verify:
#        curl http://localhost:8080/readyz

services:
  server:
    build: .
    image: auplaces:latest
    container_name: auplaces-server
    ports:
      - "8080:8080"
    volumes:
      - places_data:/data:ro    # read-only mount (D-019, INV-4)
    environment:
      - AUGEO_DB=/data/vic.db
      - AUGEO_ADDR=:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s   # dataset load can take minutes

  # One-shot loader: builds/refreshes the dataset into the volume using the
  # loader binary built into the image. The server must be stopped during a
  # refresh (the DB file is swapped by activate; a rebuild rewrites it). Run
  # with `docker compose run --rm loader`. After buildaddr, the loader also
  # builds the Step 7 suggestion index (buildsuggest) into the same DB so
  # /suggest works in-container (D-019: the loader is the only writer).
  loader:
    build: .
    image: auplaces:latest
    entrypoint: ["/bin/sh", "-c", "/usr/local/bin/auplaces-load -db /data/vic.db && /usr/local/bin/auplaces-suggest -db /data/vic.db"]
    command: []
    volumes:
      - places_data:/data
    environment:
      - AUGEO_DB=/data/vic.db
    restart: "no"

  # Monitoring: scrape /metrics from the serving server. The geocoder is in the
  # au-geocoding stack; add a target there too (or run this with both up).
  prometheus:
    image: prom/prometheus:latest
    container_name: auplaces-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

volumes:
  places_data:
