name: release

# P9 release CI: tag-triggered, multi-arch, fixture-only (never downloads real
# data), corpus-subset smoke, SBOM + signature per image, actions pinned by
# commit SHA. R9.1-R9.6.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write   # GHCR push (R9.7: publish to ghcr.io)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit SHA (R9.5). Verified SHAs from the repo's own
      # CI history. No real data (R9.2) — fixture only.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # Corpus-subset smoke (R9.3): fixture DB + committed corpus subset. CI
      # never downloads real data — the fixture DB is committed.
      - name: Corpus-subset smoke
        run: |
          go run ./cmd/gen -corpus testdata/corpus.tsv -db testdata/vic.db -limit 50
        env:
          AUGEO_DB: testdata/vic.db
      # INV-1: no raw query text is ever logged or emitted as telemetry. The
      # body IS read to decode the request (that's normal), but must never be
      # logged. Check for body/query text being written to a logger or output.
      - name: INV-1 check
        run: |
          # Legit: json.NewDecoder(r.Body).Decode(&req) reads the body to parse
          # it. Violation: logging the raw body or RawQuery text.
          if grep -rnE "log\.[A-Za-z]+\(.*r\.Body|log\.[A-Za-z]+\(.*RawQuery|logger\.(Info|Error|Warn)\(.*r\.Body|logger\.(Info|Error|Warn)\(.*RawQuery|fmt\.Print.*r\.Body|fmt\.Print.*RawQuery" --include="*.go" cmd internal; then
            echo "INV-1 violation: raw body/query text logged"; exit 1
          fi
          echo "INV-1 ok: body is decoded (not logged); no raw query text emitted"

  docker:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        arch: [amd64, arm64]   # multi-arch (R9.1)
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image for ${{ matrix.arch }}
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            -t ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.arch }} \
            --sbom=true \
            --push .

  manifest:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge multi-arch manifest (R9.7)
        run: |
          # Merge per-arch images into one manifest tag so `docker pull` gets a
          # single image with both architectures. The tag is the git tag name
          # (e.g. v1.2.3); latest is tracked separately on the main branch.
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-amd64 \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-arm64

  release-notes:
    runs-on: ubuntu-latest
    needs: manifest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Emit release notes (R9.6)
        run: |
          # R9.6: release notes state the contract version and dataset versions
          # tested against. The contract version is v1 (the internal seam is
          # versioned separately from the data); dataset versions come from the
          # fixture manifest/README.
          {
            echo "## Contract version"
            echo "v1 (internal seam; data version is separate)"
            echo "## Dataset versions tested"
            grep -E "dataset_version" README.md | head -5 || echo "see README.md"
            echo "## Corpus subset result"
            echo "CI ran the committed corpus subset against the fixture DB"
          } >> "$GITHUB_STEP_SUMMARY"
