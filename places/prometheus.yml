# Prometheus scrape config for the au-places stack. The serving server exposes
# /metrics (counters per endpoint/status, latency histogram, no query-derived
# labels). Scrape the resolver on its container name; add a target for the
# geocoder (augeo) too if both stacks are up.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: auplaces
    metrics_path: /metrics
    static_configs:
      - targets:
          - auplaces-server:8080

  - job_name: augeo
    metrics_path: /metrics
    static_configs:
      - targets:
          - augeo:8080
